{% extends "base.html" %}
{% block title %}AI Resume Analyzer & Career Coach — HireFlow{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-xl border border-gray-200 mt-6">
    <div class="text-center mb-6">
        <span class="text-xs font-semibold text-indigo-600 uppercase tracking-wider">Student Career Portal</span>
        <h1 class="text-2xl font-bold text-gray-900 mt-1">AI Resume Analyzer & Skill Matcher</h1>
        <p class="text-sm text-gray-600 mt-1">Upload your resume (PDF or DOCX) and target job role to get instant AI guidance.</p>
    </div>

    <!-- enctype attribute is mandatory for file uploads -->
    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Your Full Name</label>
            <input type="text" name="student_name" required placeholder="John Doe" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-gray-900 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Target Job Role</label>
            <input type="text" name="target_role" required placeholder="e.g. Software Engineer, Data Scientist" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-gray-900 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Upload Resume (PDF or DOCX)</label>
            <input type="file" name="resume_file" accept=".pdf,.docx" required class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-xl text-gray-700 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-4 rounded-xl font-semibold transition shadow-lg shadow-indigo-600/20 flex items-center justify-center space-x-2">
            <span>Analyze Resume with AI</span>
            <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
        </button>
    </form>
</div>
{% endblock %}
