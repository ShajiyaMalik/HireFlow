{% extends "base.html" %}
{% block title %}Login — HireFlow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-gray-200 mt-10">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Welcome Back</h1>
        <p class="text-sm text-gray-600 mt-1">Log in to manage your recruitment pipeline.</p>
    </div>

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
            <input type="email" name="email" required placeholder="recruiter@example.com" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-4 rounded-xl font-semibold transition shadow-lg shadow-indigo-600/20 flex items-center justify-center space-x-2">
            <span>Log In</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
    </form>

    <div class="flex items-center justify-between text-xs sm:text-sm text-gray-600 mt-6 pt-4 border-t border-gray-100">
        <p>Don't have an account? <a href="{{ url_for('auth_bp.register') }}" class="text-indigo-600 font-semibold hover:underline">Register</a></p>
        <a href="{{ url_for('auth_bp.verify_otp') }}" class="text-indigo-600 font-semibold hover:underline">Verify Email</a>
    </div>
</div>
{% endblock %}
