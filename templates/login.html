{% extends "base.html" %}
{% block title %}Login — HireFlow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow border border-gray-200 mt-10">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Welcome Back</h1>
        <p class="text-sm text-gray-600">Log in to manage your recruitment pipeline.</p>
    </div>

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
            <input type="email" name="email" required placeholder="recruiter@example.com" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" required placeholder="••••••••" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 font-medium transition">
            Log In
        </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
        Don't have an account? <a href="{{ url_for('auth_bp.register') }}" class="text-indigo-600 font-medium hover:underline">Register here</a>
    </p>
</div>
{% endblock %}
