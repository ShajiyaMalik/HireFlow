{% extends "base.html" %}
{% block title %}Create Job — HireFlow{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow border border-gray-200">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Create New Job Opening</h1>
    
    <form method="POST" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Job Title</label>
            <input type="text" name="title" required placeholder="e.g. Python Developer" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Job Description & Requirements</label>
            <textarea name="description" rows="6" required placeholder="Paste required skills, qualifications, responsibilities, and experience requirements..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"></textarea>
        </div>
        
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 font-medium transition">
            Save & Publish Job Posting
        </button>
    </form>
</div>
{% endblock %}
