{% extends "base.html" %}
{% block title %}Verify Email — HireFlow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-gray-200 mt-10">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Verify Your Email</h1>
        <p class="text-sm text-gray-600 mt-1">Enter the 6-digit verification code sent to your email address.</p>
    </div>

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Verification OTP</label>
            <input type="text" name="otp" required maxlength="6" placeholder="123456" class="w-full text-center tracking-widest text-lg px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-4 rounded-xl font-semibold transition shadow-lg shadow-indigo-600/20 flex items-center justify-center space-x-2">
            <span>Verify & Continue</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
    </form>

    <div class="text-center mt-6 pt-4 border-t border-gray-100 text-xs text-gray-500">
        <p>Didn't receive the code? <a href="{{ url_for('auth_bp.register') }}" class="text-indigo-600 font-semibold hover:underline">Resend / Signup again</a></p>
    </div>
</div>
{% endblock %}
