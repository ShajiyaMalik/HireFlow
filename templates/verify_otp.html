{% extends "base.html" %}
{% block title %}Verify OTP — HireFlow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow border border-gray-200 mt-10">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Email Verification</h1>
        <p class="text-sm text-gray-600">Please enter the 6-digit OTP sent to your email address.</p>
    </div>

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Enter OTP</label>
            <input type="text" name="otp" maxlength="6" required placeholder="123456" class="w-full text-center tracking-widest text-lg px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 font-medium transition">
            Verify OTP
        </button>
    </form>
</div>
{% endblock %}
