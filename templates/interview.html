{% extends "base.html" %}
{% block title %}Interview Session — HireFlow{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow border border-gray-200">
    <h1 class="text-2xl font-bold text-gray-900 mb-1">Interview Session</h1>
    <p class="text-sm text-gray-600 mb-6">Candidate: <span class="font-semibold text-gray-800">{{ candidate.name }}</span></p>
    
    <form method="POST" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Recruiter Interview Notes</label>
            <textarea name="notes" rows="8" required placeholder="Type or paste your interview notes, candidate responses, and evidence discussed during the session..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"></textarea>
        </div>
        
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 font-medium transition">
            Save Interview Notes & Evaluate
        </button>
    </form>
</div>
{% endblock %}
