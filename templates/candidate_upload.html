{% extends "base.html" %}
{% block title %}Upload Candidate Resume — HireFlow{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow border border-gray-200">
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Upload Candidate Resume</h1>
    <p class="text-sm text-gray-600 mb-6">Upload a PDF or DOCX resume. HireFlow's AI will automatically parse and analyze the candidate profile.</p>
    
    <form action="{{ url_for('candidate_bp.upload_resume', job_id=job_id) }}" method="POST" enctype="multipart/form-data" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Candidate Full Name</label>
            <input type="text" name="name" required placeholder="e.g. Rahul Sharma" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Candidate Email Address</label>
            <input type="email" name="email" required placeholder="e.g. rahul@example.com" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Resume File (PDF or DOCX)</label>
            <input type="file" name="resume" accept=".pdf,.docx" required class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>
        
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 font-medium transition">
            Upload & Analyze Candidate
        </button>
    </form>
</div>
{% endblock %}
